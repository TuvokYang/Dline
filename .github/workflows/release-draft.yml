name: "Publish Draft Release (Dev)"

# Triggered by dev-v* tags on dev branch → draft only
on:
  push:
    tags:
      - 'dev-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish as draft (e.g., dev-v3.1.2)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write
  checks: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    name: Publish Draft
    runs-on: ubuntu-latest
    environment: publish

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          lfs: true

      - name: Resolve Release Tag
        id: resolve_tag
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
        run: |
          if [[ -z "$TAG" ]]; then
            echo "Error: tag is required"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^dev-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Error: tag must match dev-vX.Y.Z (optionally with -suffix or .suffix)"
            exit 1
          fi

          git fetch origin --tags
          TAG_REF="refs/tags/$TAG"
          if ! git show-ref --verify --quiet "$TAG_REF"; then
            echo "Error: tag $TAG does not exist in the repository"
            exit 1
          fi

          # Switch to tag commit
          git checkout --detach "$TAG_REF^{commit}"
          TAG_SHA=$(git rev-parse HEAD)

          # Extract version number from tag (strip dev- prefix)
          VERSION_NUM="${TAG#dev-v}"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "resolved_sha=$TAG_SHA" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT

          # This is always a draft, never a full release
          echo "release_draft=true" >> $GITHUB_OUTPUT
          echo "release_prerelease=false" >> $GITHUB_OUTPUT
          echo "release_type=draft" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci --include=optional

      - name: Install webview-ui dependencies
        run: cd webview-ui && npm ci

      - name: Install Publishing Tools
        run: npm install -g @vscode/vsce ovsx

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify Tag Matches Package Version
        run: |
          TAG_VERSION="${{ steps.resolve_tag.outputs.version_num }}"
          PKG_VERSION="${{ steps.get_version.outputs.version }}"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Error: tag version '$TAG_VERSION' does not match package version '$PKG_VERSION'"
            exit 1
          fi
          echo "Tag version matches package: $TAG_VERSION"

      - name: Verify LFS media assets are resolved
        run: |
          for FILE in webview-ui/src/assets/cline_kanban_demo.mp4 webview-ui/src/assets/cline_kanban_demo.webm; do
            if grep -q "git-lfs.github.com/spec/v1" "$FILE"; then
              echo "Error: $FILE is still a Git LFS pointer in CI checkout"
              exit 1
            fi
          done

      - name: Build Package
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          CLINE_ENVIRONMENT: production
          RELEASE_TYPE: ${{ steps.resolve_tag.outputs.release_type }}
          TELEMETRY_SERVICE_API_KEY: ${{ secrets.TELEMETRY_SERVICE_API_KEY }}
          ERROR_SERVICE_API_KEY: ${{ secrets.ERROR_SERVICE_API_KEY }}
          OTEL_TELEMETRY_ENABLED: ${{ secrets.OTEL_TELEMETRY_ENABLED }}
          OTEL_LOGS_EXPORTER: otlp
          OTEL_METRICS_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          # Required to generate the .vsix
          vsce package --allow-package-secrets sendgrid --out "dline-${{ steps.get_version.outputs.version }}.vsix"

      - name: Get Previous Tag
        id: prev_tag
        run: |
          CURRENT_TAG="${{ steps.resolve_tag.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Get Changelog Entry
        id: changelog
        run: |
          VERSION_NUM="${{ steps.resolve_tag.outputs.version_num }}"
          ESCAPED_VER=$(echo "$VERSION_NUM" | sed 's/\./\\./g')
          CONTENT=$(awk -v ver="$ESCAPED_VER" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [[ -z "$CONTENT" ]]; then
            echo "Error: no changelog entry found for version $VERSION_NUM"
            exit 1
          fi
          DELIM="EOF_${RANDOM}"
          echo "content<<${DELIM}" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "${DELIM}" >> $GITHUB_OUTPUT

      - name: Create GitHub Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          files: "*.vsix"
          draft: ${{ steps.resolve_tag.outputs.release_draft == 'true' }}
          prerelease: ${{ steps.resolve_tag.outputs.release_prerelease == 'true' }}
          body: |
            ${{ steps.changelog.outputs.content }}
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.prev_tag }}...${{ steps.resolve_tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
