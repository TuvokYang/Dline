syntax = "proto3";

package dline.provider;

import "dline/models/metadata.proto";
import "dline/provider/common.proto";

message OpenAiCodexProviderConfig {
  ReasoningConfig reasoning = 1;
  bool custom_model_enabled = 2;
  dline.models.ModelCapabilities capabilities = 3;
  dline.models.ModelPricing pricing = 4;
  // OpenAI request processing tier (auto/default/flex/scale/priority/ultrafast)
  optional string service_tier = 5;
  // Whether this endpoint supports Service Tier controls. Missing values remain enabled for compatibility.
  optional bool service_tier_enabled = 6;
  // Hosted server tools the user turned off for this profile. See
  // BaseProviderConfig.disabled_server_tools for the subtraction semantics.
  repeated dline.models.ServerTool disabled_server_tools = 7;
}
