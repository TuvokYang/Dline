syntax = "proto3";

package dline.provider;

import "dline/models/metadata.proto";
import "dline/provider/common.proto";

// Per-profile policy for OpenAI prompt cache controls.
enum OpenAiPromptCacheMode {
  // Use the endpoint's automatic caching with a stable prompt_cache_key.
  OPENAI_PROMPT_CACHE_MODE_AUTOMATIC = 0;
  // Send OpenAI explicit breakpoint controls and fall back if rejected.
  OPENAI_PROMPT_CACHE_MODE_EXPLICIT = 1;
}

message OpenAiProviderConfig {
  ReasoningConfig reasoning = 1;
  bool custom_model_enabled = 2;
  dline.models.ModelCapabilities capabilities = 3;
  dline.models.ModelPricing pricing = 4;
  // Azure API version override (e.g., "2024-10-01-preview")
  optional string azure_api_version = 5;
  // Use Azure Identity (DefaultAzureCredential) instead of API key
  bool azure_identity = 6;
  // Custom HTTP headers to include in OpenAI/Azure API requests
  map<string, string> open_ai_headers = 7;
  // Default temperature for model requests
  optional double temperature = 8;
  // Whether to include usage stats in stream responses
  bool stream_include_usage = 9;
  // OpenAI request processing tier (auto/default/flex/scale/priority)
  optional string service_tier = 10;
  // Deprecated compatibility field. New profiles use api_format.
  optional string api_endpoint = 11;
  // Request protocol selected for this profile.
  optional dline.models.ApiFormat api_format = 12;
  // Select the model's long-context tier when available.
  optional bool enable_long_context = 13;
  // Apply editable pricing tiers when configured.
  optional bool pricing_tiers_enabled = 14;
  // Abort a Responses stream after this many seconds without any event.
  optional uint32 stream_idle_timeout_seconds = 15;
  // Prompt cache control policy for this profile. Defaults to automatic.
  OpenAiPromptCacheMode prompt_cache_mode = 16;
  // Whether this endpoint supports Service Tier controls. Missing values remain enabled for compatibility.
  optional bool service_tier_enabled = 17;
  // Hosted server tools the user turned off for this profile. See
  // BaseProviderConfig.disabled_server_tools for the subtraction semantics.
  repeated dline.models.ServerTool disabled_server_tools = 18;
}
